<!DOCTYPE html>
<html>
  <style type="text/css">
        html, body {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
        }

        /* Two embeds occupy the same box; the active one is stacked on top. Both stay
           laid out and painted on purpose — display:none or visibility:hidden detaches
           the iframe from the compositor and browsers throttle media inside it, which is
           exactly the buffering the standby exists to do ahead of time. */
        .ytSlot {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>

  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- NOTE: this file, not the identically named one in extensions/ayp, is what ships.
         An app module resource wins the merge over a library one, so edits made only in
         the ayp module never reach the APK. Change both, or change this one. -->

    <!-- Open the DNS lookup and TCP handshake before any JS runs, so the first song of a
         session does not pay for them. Only hosts that actually resolve are listed: the
         media servers live on per session googlevideo subdomains, and a preconnect to a
         wildcard or to the bare domain opens a connection nothing will ever reuse. -->
    <link rel="preconnect" href="https://www.youtube.com">
    <link rel="dns-prefetch" href="https://i.ytimg.com">

    <!-- The AudioContext compressor patch that used to sit here has been taken out while
         we work out where a mid-session volume drop comes from. It neutralised YouTube's
         DynamicsCompressor, and removing a compressor lowers perceived loudness, so it is
         the first suspect. Do not put it back without an A/B against this build. -->

    <!-- defer forces the library to execute after the html page is fully parsed. -->
    <!-- This is needed to avoid race conditions, where the library executes and calls `onYouTubeIframeAPIReady` before the page is fully parsed. -->
    <!-- See #873 on GitHub -->
    <script defer src="https://www.youtube.com/iframe_api"></script>
  </head>

  <body>
    <div class="ytSlot" id="ytSlot0"><div id="youTubePlayerDOM"></div></div>
    <div class="ytSlot" id="ytSlot1"><div id="youTubePlayerDOM_standby"></div></div>
  </body>

  <script type="text/javascript">
    var UNSTARTED = "UNSTARTED";
    var ENDED = "ENDED";
    var PLAYING = "PLAYING";
    var PAUSED = "PAUSED";
    var BUFFERING = "BUFFERING";
    var CUED = "CUED";

    var YouTubePlayerBridge = window.YouTubePlayerBridge;
    var YouTubePlayerCallbacks = window.YouTubePlayerCallbacks;

    // Two embeds, one audible.
    //
    // Changing song costs a wait that no amount of work on the Kotlin side can shorten:
    // the instrumentation in PlayerService splits it into startup (~64 ms median) and
    // network (~1.7 s median), and the second number is the embed fetching the new video.
    // A single iframe plays one video at a time, so the only way to have those bytes
    // already in hand is a second embed that loaded the next song while the current one
    // was still playing. On a queue advance the two swap roles and playback starts from
    // a buffer instead of from a request.
    //
    // Kotlin still sees exactly one player: every entry point below acts on the active
    // slot, and only the active slot's callbacks reach the bridge. The standby is created
    // lazily on the first preloadVideo call, so with the feature off this page behaves,
    // and costs, precisely what it did when it hosted a single embed.
    var players = [null, null];
    var slots = [null, null];
    var playerReady = [false, false];
    var activeIndex = 0;
    var reportedReady = false;

    // Held by the standby: the id it was asked to warm, and whether it got far enough
    // (fetched audio, then parked at 0) for a swap to be instant rather than a gamble.
    var preloadedVideoId = null;
    var preloadArmed = false;
    var pendingPreloadVideoId = null;

    // The embed cannot be asked what volume it is at without a round trip, and a swap has
    // to hand the incoming player the same level the outgoing one had.
    var lastVolume = 100;

    var injectedPlayerVars = <<injectedPlayerVars>>;

    var timerId;
    var captionIntervalId = null;

    function activePlayer() {
      return players[activeIndex];
    }

    function standbyIndex() {
      return 1 - activeIndex;
    }

    function applyStacking() {
      if (!slots[0] || !slots[1]) return;
      slots[activeIndex].style.zIndex = '2';
      slots[standbyIndex()].style.zIndex = '1';
    }

    // YT.Player mutates the options object it is given, so the two embeds cannot share one.
    function playerVarsCopy() {
      var copy = {};
      for (var key in injectedPlayerVars) {
        if (Object.prototype.hasOwnProperty.call(injectedPlayerVars, key)) {
          copy[key] = injectedPlayerVars[key];
        }
      }
      return copy;
    }

    // What used to live here: three tweaks that reached into the embed's document to hide
    // the video title, hide the pause overlay, and skip ads. They could never work. This
    // page is served from music.youtube.com and the embed is www.youtube.com, so the browser
    // refuses every read across that boundary — contentDocument comes back null, silently,
    // and the code just tried again ten times a second forever. The proof is in the log: the
    // one place that read contentWindow instead got a SecurityError naming both origins.
    //
    // They are gone rather than fixed. Making them work means serving this page from the
    // embed's own origin, and that origin is what tells YouTube this is a music client;
    // trading that for a set of tweaks that poke at private CSS class names, which break
    // whenever YouTube renames one, is a bad deal.
    //
    // Captions are different and stay: unloadModule goes through the player's own API, not
    // through the document, so it crosses the origin boundary legitimately.
    function armCaptionHiding() {
      if (captionIntervalId) {
        clearInterval(captionIntervalId);
      }
      var ticks = 0;
      captionIntervalId = setInterval(function () {
        ticks++;
        var current = activePlayer();
        if (current) {
          current.unloadModule('captions');
        }
        // unloadModule reports nothing back, so this cannot detect success. It covers the
        // load of each song and then stops, instead of running for the whole session.
        if (ticks >= 15) {
          clearInterval(captionIntervalId);
          captionIntervalId = null;
        }
      }, 1000);
    }

    function showCaption() {
      var current = activePlayer();
      if (!current) {
        return;
      }
      current.loadModule('captions');
    }

    function buildPlayer(index, domId) {
      return new YT.Player(domId, {

        height: '100%',
        width: '100%',

        events: {
          onReady: function(event) {
            playerReady[index] = true;

            if (index === activeIndex) {
              armCaptionHiding();
              // The library treats sendReady as "the player exists", and answering it twice
              // would run the service's onReady twice — reassigning the player reference and
              // reloading the current song from the top.
              if (!reportedReady) {
                reportedReady = true;
                YouTubePlayerBridge.sendReady();
              }
            } else {
              event.target.mute();
              event.target.setVolume(0);
              // The standby is built on the first preload request, so by the time it is
              // ready there is already a song waiting for it.
              if (pendingPreloadVideoId) {
                var queued = pendingPreloadVideoId;
                pendingPreloadVideoId = null;
                preloadVideo(queued);
              }
            }
          },
          onStateChange: function(event) { handleStateChange(index, event.data) },
          onPlaybackQualityChange: function(event) {
            if (index === activeIndex) YouTubePlayerBridge.sendPlaybackQualityChange(event.data)
          },
          onPlaybackRateChange: function(event) {
            if (index === activeIndex) YouTubePlayerBridge.sendPlaybackRateChange(event.data)
          },
          onError: function(error) { handleError(index, error.data) },
          onApiChange: function(event) {
            if (index === activeIndex) YouTubePlayerBridge.sendApiChange()
          }
        },

        playerVars: playerVarsCopy()

      });
    }

    function onYouTubeIframeAPIReady() {

      YouTubePlayerBridge.sendYouTubeIFrameAPIReady();

      slots[0] = document.getElementById('ytSlot0');
      slots[1] = document.getElementById('ytSlot1');
      applyStacking();

      players[0] = buildPlayer(0, 'youTubePlayerDOM');
    }

    // Built on demand rather than up front: a second embed is tens of megabytes and a
    // second set of requests, and a user who never turns preloading on should pay neither.
    function ensureStandbyPlayer() {
      var index = standbyIndex();
      if (players[index]) return players[index];
      if (typeof YT === 'undefined' || !YT.Player) return null;

      players[index] = buildPlayer(index, index === 1 ? 'youTubePlayerDOM_standby' : 'youTubePlayerDOM');
      applyStacking();
      return players[index];
    }

    function handleStateChange(index, playerState) {
      if (index !== activeIndex) {
        handleStandbyStateChange(index, playerState);
        return;
      }

      clearTimeout(timerId);

      switch (playerState) {
        case YT.PlayerState.UNSTARTED:
          sendStateChange(UNSTARTED);
          sendVideoIdFromPlaylistIfAvailable();
          return;

        case YT.PlayerState.ENDED:
          sendStateChange(ENDED);
          return;

        case YT.PlayerState.PLAYING:
          sendStateChange(PLAYING);

          startSendCurrentTimeInterval();
          sendVideoData();
          return;

        case YT.PlayerState.PAUSED:
          sendStateChange(PAUSED);
          return;

        case YT.PlayerState.BUFFERING:
          sendStateChange(BUFFERING);

          // Some WebView sessions sit in BUFFERING while the audio keeps playing. The
          // clearTimeout at the top of this function had already stopped the ticker, so
          // the seekbar froze even though the song was advancing. Keep reporting position
          // and duration here, exactly as PLAYING does.
          startSendCurrentTimeInterval();
          sendVideoData();
          return;

        case YT.PlayerState.CUED:
          sendStateChange(CUED);
          return;
      }
    }

    // The standby is warming up, so none of this is anybody's business but ours.
    //
    // PLAYING is the signal we are waiting for: cueVideoById only fetches the player
    // module and the metadata, not the media, so the only way to have audio in hand is to
    // load it for real. It runs muted, and the moment it reports playback — meaning the
    // first bytes have arrived — it is parked back at zero so the swap starts the song
    // where it should and not a third of a second in.
    function handleStandbyStateChange(index, playerState) {
      if (!preloadedVideoId || preloadArmed) return;
      var standby = players[index];
      if (!standby) return;

      if (playerState === YT.PlayerState.PLAYING) {
        preloadArmed = true;
        try {
          standby.pauseVideo();
          standby.seekTo(0, true);
        } catch (e) {
          preloadArmed = false;
        }
      }
    }

    function handleError(index, errorCode) {
      if (index === activeIndex) {
        YouTubePlayerBridge.sendError(errorCode);
        return;
      }

      // A preload that will not play is not worth reporting. The song is not the one
      // playing, and forwarding this would fire the service's error recovery — which
      // reloads and restarts whatever IS playing — over a song nobody has reached yet.
      preloadedVideoId = null;
      preloadArmed = false;
    }

    function sendVideoData() {
      var current = activePlayer();
      if (!current) return;
      YouTubePlayerBridge.sendVideoDuration(current.getDuration());
    }

    // This method checks if the player is playing a playlist.
    // If yes, it sends out the video id of the video being played.
    function sendVideoIdFromPlaylistIfAvailable() {
      var current = activePlayer();
      if (!current) return;
      var playlist = current.getPlaylist();
      if ( typeof playlist !== 'undefined' && Array.isArray(playlist) && playlist.length > 0 ) {
        var index = current.getPlaylistIndex();
        var videoId = playlist[index];
        YouTubePlayerBridge.sendVideoId(videoId);
      }
    }

    function sendStateChange(newState) {
      YouTubePlayerBridge.sendStateChange(newState)
    }

    function startSendCurrentTimeInterval() {
      clearTimeout(timerId);
      timerId = setInterval(function() {
        var current = activePlayer();
        if (!current) return;
        YouTubePlayerBridge.sendVideoCurrentTime( current.getCurrentTime() )
        YouTubePlayerBridge.sendVideoLoadedFraction( current.getVideoLoadedFraction() )
      }, 100 );
    }

    // JAVA to WEB functions

    function seekTo(startSeconds) {
      activePlayer().seekTo(startSeconds, true);
    }

    function pauseVideo() {
      activePlayer().pauseVideo();
    }

    function playVideo() {
      activePlayer().playVideo();
    }

    function loadVideo(videoId, startSeconds) {
      if (swapToPreloaded(videoId, startSeconds)) return;

      // Whatever the standby holds is not what was asked for.
      discardPreload();

      activePlayer().loadVideoById(videoId, startSeconds);
      armCaptionHiding();
      YouTubePlayerBridge.sendVideoId(videoId);
    }

    // Forgetting the preload is not enough — it has to be stopped.
    //
    // The standby only parks itself in handleStandbyStateChange, and that function opens by
    // returning when preloadedVideoId is null. So clearing the state on its own left an
    // embed that never got its pauseVideo: it went on pulling video down, muted, in
    // parallel with the song the user is listening to, until it reached the end. Skipping
    // the swap is not rare either — pressing next before the standby has buffered, or any
    // recovery that loads with a position, takes this path.
    function discardPreload() {
      preloadedVideoId = null;
      preloadArmed = false;
      pendingPreloadVideoId = null;

      var standby = players[standbyIndex()];
      if (!standby) return;
      try {
        standby.mute();
        standby.stopVideo();
      } catch (e) { }
    }

    function cueVideo(videoId, startSeconds) {
      activePlayer().cueVideoById(videoId, startSeconds);
      armCaptionHiding();
      YouTubePlayerBridge.sendVideoId(videoId);
    }

    // Warms the given song in the standby embed. Safe to call repeatedly with the same id
    // and safe to call when nothing is playing; it is a no-op both times.
    function preloadVideo(videoId) {
      if (!videoId) return;
      if (preloadedVideoId === videoId) return;

      var standby = ensureStandbyPlayer();
      if (!standby) return;

      // Built just now: hold the request until its onReady says the embed can take it.
      if (!playerReady[standbyIndex()]) {
        pendingPreloadVideoId = videoId;
        return;
      }

      preloadedVideoId = videoId;
      preloadArmed = false;

      try {
        standby.mute();
        standby.setVolume(0);
        standby.loadVideoById(videoId, 0);
      } catch (e) {
        preloadedVideoId = null;
      }
    }

    // Returns true when the song asked for was already sitting buffered in the standby and
    // the two embeds have traded places. Every condition here is a reason to fall back to
    // an ordinary load instead: a half-finished preload, a different song, or a request to
    // start part-way in, which is a recovery or a restored position and not a queue advance.
    function swapToPreloaded(videoId, startSeconds) {
      if (!preloadArmed) return false;
      if (preloadedVideoId !== videoId) return false;
      if (startSeconds && startSeconds > 1) return false;

      var incoming = standbyIndex();
      var outgoing = activeIndex;
      if (!players[incoming] || !playerReady[incoming]) return false;

      // Flipping activeIndex first is what silences the outgoing embed: the stopVideo
      // below raises UNSTARTED, and reaching the bridge it would read as the new song
      // failing to start and trip the service's watchdog.
      activeIndex = incoming;
      applyStacking();

      try {
        players[outgoing].mute();
        players[outgoing].stopVideo();
      } catch (e) { }

      // The incoming player gets a net too. If its object has been invalidated — a WebView
      // renderer restart does that — throwing here would escape loadVideo before it could
      // fall back, with activeIndex already pointing at the broken embed: no state change,
      // no videoId, nothing for the service's watchdog to catch, and a song that simply
      // never starts. Putting activeIndex back and reporting failure sends the caller down
      // the ordinary load path on the player that was working a moment ago.
      try {
        var current = players[incoming];
        current.unMute();
        current.setVolume(lastVolume);
        current.playVideo();
      } catch (e) {
        activeIndex = outgoing;
        applyStacking();
        preloadedVideoId = null;
        preloadArmed = false;
        return false;
      }

      preloadedVideoId = null;
      preloadArmed = false;

      armCaptionHiding();
      YouTubePlayerBridge.sendVideoId(videoId);
      return true;
    }

    function mute() {
      activePlayer().mute();
    }

    function unMute() {
      activePlayer().unMute();
    }

    function setVolume(volumePercent) {
      lastVolume = volumePercent;
      activePlayer().setVolume(volumePercent);
    }

    function setPlaybackRate(playbackRate) {
      activePlayer().setPlaybackRate(playbackRate);
    }

    function toggleFullscreen() {
      activePlayer().toggleFullscreen();
    }

    function nextVideo() {
      activePlayer().nextVideo();
    }

    function previousVideo() {
      activePlayer().previousVideo();
    }

    function playVideoAt(index) {
      activePlayer().playVideoAt(index);
    }

    function setLoop(loop) {
      activePlayer().setLoop(loop);
    }

    function setShuffle(shuffle) {
      activePlayer().setShuffle(shuffle);
    }

    // Backs YouTubePlayer.isMutedAsync / isMuted. Without it the Kotlin side registers
    // the callbacks interface, calls a function that does not exist, and the
    // suspendCoroutine behind isMuted() never resumes — a coroutine suspended forever
    // rather than a visible failure. Nothing calls it today; this keeps it from becoming
    // a trap the first time something does.
    function getMuteValue(requestId) {
      var isMuted = activePlayer().isMuted();
      YouTubePlayerCallbacks.sendBooleanValue(requestId, isMuted);
    }

  </script>
</html>
