name: Test build (no release)

# Builds the signed full release APK of a fix/** or test/** branch and keeps it as a workflow
# artifact for 3 days, so it can be installed over the published app (same signature) and tried
# on a phone before anything is published. It never creates a tag or a GitHub Release.

on:
  push:
    branches:
      - 'fix/**'
      - 'test/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::KEYSTORE_BASE64 secret is missing."; exit 1; }
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore/release.keystore"
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/keystore/release.keystore" >> "$GITHUB_ENV"

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          [ -n "$GOOGLE_SERVICES_JSON_BASE64" ] || { echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is missing."; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > composeApp/google-services.json

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: chmod +x gradlew && ./gradlew :composeApp:assembleFullRelease --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find composeApp/build/outputs/apk/full/release -name '*.apk' -print -quit)
          [ -n "$APK_PATH" ] || { echo "::error::No APK produced."; exit 1; }
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
          sha256sum "$APK_PATH"

      - name: Upload APK (artifact only, 3 days)
        uses: actions/upload-artifact@v4
        with:
          name: yammbo-music-test-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 3
          if-no-files-found: error

  # The desktop app shares the Yammbo API code paths; compile it too so a desktop-only break shows
  # up here instead of in Desktop Release after a tag.
  desktop-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: gradle

      - name: Compile desktop (JVM) sources
        run: chmod +x gradlew && ./gradlew :composeApp:compileKotlinDesktop --no-daemon --stacktrace
